<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Website</h1>
        <p>Responsive Webpage Layout</p>
    </header>

    <div class="container">

        <aside>
            <h2>Sidebar</h2>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
            </ul>
        </aside>

        <main>
            <h2>Main Content</h2>
            <p>
                Welcome to my responsive webpage. This layout is created
                using HTML and CSS.
            </p>
            <p>
                The layout changes automatically according to the screen size.
            </p>
        </main>

    </div>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
